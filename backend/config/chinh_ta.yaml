# Cấu hình soát mặt chữ của workflow 2.
#
# ⚠️ ĐỌC TRƯỚC KHI SỬA - file này có hai phần, CODE CHỈ ĐỌC MỘT.
#
#   `co_hoc`              ĐANG CHẠY. Lỗi đo được bằng vị trí ký tự: thừa dấu cách,
#                         thiếu dấu cách sau dấu câu, dấu cách trước dấu câu, lặp
#                         từ, ngoặc đơn không khớp. Hoàn toàn tất định.
#
#   `tu_sai`, `chuan_hoa` CODE KHÔNG ĐỌC NỮA (20/09/2026). Giữ lại làm tư liệu -
#                         xem bên dưới.
#
# ---------------------------------------------------------------------------
# VÌ SAO BỎ BẢNG CẶP SAI->ĐÚNG
#
# Bảng cặp không kết luận được một mình. Tiếng Việt viết rời từng âm tiết, nên hễ
# CẢ HAI VẾ đều là từ có thật thì luôn tồn tại câu ĐÚNG đặt chúng cạnh nhau. Dựng
# câu chạy thử thì 26 cặp báo oan, kể cả những cặp trông chắc chắn nhất:
#
#     "Đơn vị CŨNG CỐ gắng hoàn thành."        cũng + cố gắng
#     "Việc phân CHIA SẼ được thực hiện."      chia + sẽ được
#     "HỒ SƠ XUẤT khẩu đã được phê duyệt."     hồ sơ + xuất khẩu
#     "Thành TỰU CHUNG của đơn vị năm 2026."   thành tựu + chung
#     "Phòng giám SÁT NHẬP khẩu thiết bị."     giám sát + nhập khẩu
#     "Thuốc BỔ XUNG quanh khu vực."           thuốc bổ + xung quanh
#
# Đã thử vá bằng một cổng gác LLM (bảng tìm ứng viên, LLM phán ngữ cảnh): xuống
# còn 2/20 báo oan, nhưng phải nuôi thêm một node, một prompt và 215 dòng bảng -
# mà vẫn cần LLM. Nay giao hẳn chính tả cho LLM với prompt riêng
# (`DOC_SPELL_SYSTEM`), đo lại: 0/23 báo oan, 0/14 bỏ sót, ổn định qua 3 lượt.
#
# Bảng vẫn nằm đây vì nó là TƯ LIỆU SOẠN PROMPT: phần "những lỗi hay gặp nhất
# trong văn bản hành chính" của `DOC_SPELL_SYSTEM` rút ra từ chính bảng này. Thêm
# cặp vào đây không làm gì cả - muốn model để ý lỗi mới thì sửa prompt.
#
# ---------------------------------------------------------------------------
# `co_hoc` THÌ KHÔNG GIAO CHO LLM, và sẽ không giao:
#
# Bộ tách từ của model nuốt mất khoảng trắng nên nó không "nhìn" thấy hai dấu cách
# liền nhau, còn regex thì thấy chính xác. Prompt của cả hai nhánh LLM đều có câu
# dặn đừng đụng vào dấu cách và dấu câu, để không báo trùng.
#
# Khối BẢNG được bỏ qua ở cả ba tiêu chí: ô bảng vốn căn chỉnh bằng dấu cách, và
# hai ô cạnh nhau trùng nội dung là chuyện bình thường.
#
# ---------------------------------------------------------------------------
# Ghi chú của người soạn bảng (giữ nguyên, vẫn đúng):
#
# - `tu_sai`: chỉ chứa các cách viết có độ chắc chắn cao.
# - `chuan_hoa`: biến thể nên ưu tiên trong văn bản hành chính, không phải lỗi cứng.
# - Những cặp sau KHÔNG giải quyết an toàn được chỉ bằng cặp sai->đúng:
#   dành/giành, dấu/giấu, chở/trở, s/x và hỏi/ngã khi cả hai đều thành từ có nghĩa,
#   bàng quan/bàng quang, giả thiết/giả thuyết, truyện/chuyện.
#   -> Đã đo: cổng gác LLM cũng chỉ đúng 5/8 trên nhóm này. Nhận định này vẫn đúng.

meta:
  name: "Chính tả tiếng Việt"
  version: "2026-09-20.2"

