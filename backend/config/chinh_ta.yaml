# --------------------------------------------------------------------------- #
# GHI CHÚ TRIỂN KHAI
#
# 1) Không dùng `.replace()` trên toàn chuỗi.
#    Tối thiểu phải match theo token boundary và ưu tiên longest-match.
#
# 2) Những lỗi sau KHÔNG thể giải quyết an toàn chỉ bằng cặp sai->đúng:
#      dành / giành
#      dấu / giấu
#      chở / trở
#      s / x khi cả hai tạo thành từ có nghĩa
#      hỏi / ngã khi cả hai từ đều tồn tại
#      bàng quan / bàng quang
#      giả thiết / giả thuyết
#      khuyến mãi / khuyến mại
#      phong thanh / phong phanh
#      truyện / chuyện
#
# 3) Muốn phủ "mọi lỗi có thể" mà vẫn deterministic:
#    - lexicon từ chuẩn
#    - bộ kiểm tra cấu trúc âm tiết tiếng Việt
#    - confusion sets (s/x, ch/tr, d/gi/r, hỏi/ngã...)
#    - edit distance chỉ để SINH ứng viên
#    - chỉ báo lỗi khi ứng viên đúng là duy nhất hoặc rule có ngữ cảnh xác định
#
# 4) Tên riêng, mã sản phẩm, URL, email, code, path, số hiệu văn bản nên được
#    mask trước khi chạy spell-check.
