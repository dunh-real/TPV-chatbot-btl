# Bộ tiêu chí thể thức văn bản hành chính, lấy Nghị định 30/2020/NĐ-CP làm nền.
#
# CẢNH BÁO: các con số dưới đây cần đối chiếu lại với văn bản gốc trước khi dùng
# chính thức. Chúng để ở đây chính là để sửa được mà không phải đụng vào code.
#
# severity: error   -> sai thể thức, phải sửa
#           warning -> nên xem lại
#           info    -> chỉ ghi nhận

meta:
  name: "Nghị định 30/2020/NĐ-CP"
  version: "2020-03-05"
  # Tên hiển thị khi người dùng chọn bộ tiêu chí trong giao diện.
  label: "Nghị định 30/2020/NĐ-CP (văn bản hành chính)"

# Bộ tiêu chí này chỉ áp cho VĂN BẢN HÀNH CHÍNH. Đem thước đo công văn soi một
# bản ghi chú kỹ thuật thì ra vài chục lỗi đúng về mặt máy móc mà vô nghĩa với
# người đọc, nên trước khi soát phải hỏi: tệp này có phải văn bản hành chính không?
#
# Đủ `min_matches` dấu hiệu thì áp; không đủ thì trả status=skipped kèm lý do.
applies_when:
  markers: [quoc_hieu, tieu_ngu, so_ky_hieu, ten_loai, kinh_gui, noi_nhan]
  min_matches: 2
  message: >-
    Tệp không mang dấu hiệu của văn bản hành chính (thiếu cả quốc hiệu, tiêu ngữ,
    số ký hiệu lẫn tên loại), nên không áp bộ tiêu chí thể thức này. Nếu đây đúng
    là văn bản hành chính, hãy kiểm tra lại phần đầu văn bản.

format:
  font:
    allowed: ["Times New Roman"]
    severity: error
    message: "Phông chữ phải là Times New Roman (bộ mã Unicode TCVN 6909:2001)"

  size_pt:
    min: 13
    max: 14
    severity: error
    message: "Cỡ chữ phần nội dung phải từ 13 đến 14"
    # Bỏ qua tiêu đề: tên loại văn bản và quốc hiệu được phép cỡ khác.
    skip_components: [quoc_hieu, tieu_ngu, ten_loai, chu_ky]

  page_mm:
    width: [200, 220]        # khổ A4: 210mm
    height: [290, 305]       # 297mm
    severity: warning
    message: "Văn bản phải trình bày trên khổ giấy A4"

  margin_mm:
    top: [20, 25]
    bottom: [20, 25]
    left: [30, 35]
    right: [15, 20]
    severity: warning
    message: "Lề trang chưa đúng quy định"
    # Word lưu lề theo inch rồi quy sang mm, nên lề "1.5cm" đọc về là 14.993mm.
    # Không có dung sai thì mọi văn bản đặt lề đúng đều bị báo sai.
    tolerance_mm: 0.5
    # Với PDF, lề chỉ đo được từ vùng chữ thực tế nên lề dưới/phải không đáng tin.
    measured_only: [top, left]

  # --- các tiêu chí dưới đây chỉ áp cho phần NỘI DUNG ---------------------- #
  # Tiêu đề mục, quốc hiệu, chữ ký có quy tắc riêng nên được loại ra.
  alignment:
    body: JUSTIFY
    severity: warning
    message: "Phần nội dung phải canh đều hai bên (Justified)"

  line_spacing:
    # "dòng đơn HOẶC tối thiểu 1.15" - nên 1.0 hợp lệ, 1.15 trở lên hợp lệ,
    # còn khoảng hở giữa hai mốc thì không.
    single: 1.0
    min: 1.15
    severity: warning
    message: "Dòng cách dòng phải là dòng đơn hoặc tối thiểu 1.15"

  paragraph_spacing_pt:
    min: 3
    max: 6
    severity: warning
    message: "Khoảng cách giữa các đoạn phải từ 3 đến 6pt"

# Định dạng riêng của từng thành phần thể thức. Khác `required_components` ở chỗ
# phần kia chỉ hỏi "có hay không", phần này hỏi "trình bày đã đúng chưa".
component_format:
  quoc_hieu:
    label: "Quốc hiệu"
    uppercase: true
    bold: true
    size_pt: [12, 13]
    severity: warning
  tieu_ngu:
    label: "Tiêu ngữ"
    uppercase: false
    bold: true
    size_pt: [13, 14]
    alignment: CENTER
    severity: warning

# Chức danh người ký. Doanh nghiệp ký "TỔNG GIÁM ĐỐC", đơn vị quân đội ký "CHỈ
# HUY TRƯỞNG", trường học ký "HIỆU TRƯỞNG" - liệt kê ở đây chứ không chôn trong
# code. Các dạng "TRƯỞNG ..." và ký thay/ký thừa lệnh (TM./KT./TL./Q.) đã được
# nhận sẵn, không cần khai lại.
chuc_danh_ky:
  - GIÁM ĐỐC
  - TỔNG GIÁM ĐỐC
  - PHÓ GIÁM ĐỐC
  - PHÓ TỔNG GIÁM ĐỐC
  - CHÁNH VĂN PHÒNG
  - PHÓ CHÁNH VĂN PHÒNG
  - CHỈ HUY TRƯỞNG
  - CHÍNH TRỊ VIÊN
  - HIỆU TRƯỞNG
  - CHỦ TỊCH
  - CHỦ NHIỆM

# Danh sách CHUNG cho mọi loại văn bản hành chính. Từng loại ở `document_types`
# bên dưới chỉ ghi đè phần khác biệt của mình.
required_components:
  - id: quoc_hieu
    label: "Quốc hiệu"
    severity: error
  - id: tieu_ngu
    label: "Tiêu ngữ (Độc lập - Tự do - Hạnh phúc)"
    severity: error
  - id: so_ky_hieu
    label: "Số, ký hiệu văn bản"
    severity: error
    validate: so_ky_hieu
  - id: dia_danh_ngay
    label: "Địa danh và ngày tháng năm ban hành"
    severity: error
    validate: ngay_ban_hanh
  - id: ten_loai
    label: "Tên loại văn bản"
    severity: warning
  - id: trich_yeu
    label: "Trích yếu nội dung (V/v ...)"
    severity: warning
  - id: noi_nhan
    label: "Nơi nhận"
    severity: warning
  - id: chu_ky
    label: "Quyền hạn, chức vụ người ký"
    severity: error

# --------------------------------------------------------------------------- #
# Tiêu chí riêng theo loại văn bản
#
# Không phải văn bản nào cũng là công văn: quyết định không có dòng "V/v", biên
# bản thường không đánh số ký hiệu, còn công văn là loại DUY NHẤT không ghi tên
# loại - đòi đủ mọi thành phần cho mọi loại thì loại nào cũng sai vài chỗ.
#
# `match`: cách nhận ra loại, hoàn toàn tất định (đọc từ chính văn bản, không hỏi
#   LLM). `ten_loai` khớp theo dòng tên loại; `absent`/`present` xét sự có mặt của
#   thành phần. Loại nào khớp trước trong danh sách này thì lấy loại đó.
# `drop`: bỏ khỏi danh sách bắt buộc (loại này không có thành phần đó).
# `require`: thêm vào danh sách bắt buộc, kèm nhãn và mức độ.
#
# CẢNH BÁO: giống các con số ở trên, phần này cần đối chiếu lại với Nghị định 30
# trước khi dùng chính thức. Để ở YAML chính là để sửa mà không phải đụng code.
# --------------------------------------------------------------------------- #
document_types:
  - id: quyet_dinh
    label: "Quyết định"
    match: {ten_loai: ["QUYẾT ĐỊNH"]}
    # Quyết định ghi "Về việc ..." ngay dưới tên loại thay vì dạng "V/v" của công
    # văn - phần dò thành phần đã hiểu cả hai, nên ở đây không phải bỏ qua gì.

  - id: bao_cao
    label: "Báo cáo"
    match: {ten_loai: ["BÁO CÁO"]}

  - id: to_trinh
    label: "Tờ trình"
    match: {ten_loai: ["TỜ TRÌNH"]}
    require:
      - id: kinh_gui
        label: "Kính gửi"
        severity: error

  - id: thong_bao
    label: "Thông báo"
    match: {ten_loai: ["THÔNG BÁO"]}

  - id: ke_hoach
    label: "Kế hoạch"
    match: {ten_loai: ["KẾ HOẠCH"]}

  - id: chi_thi
    label: "Chỉ thị"
    match: {ten_loai: ["CHỈ THỊ"]}

  - id: nghi_quyet
    label: "Nghị quyết"
    match: {ten_loai: ["NGHỊ QUYẾT"]}

  - id: bien_ban
    label: "Biên bản"
    match: {ten_loai: ["BIÊN BẢN"]}
    # Biên bản lập tại chỗ thường không vào sổ nên không có số ký hiệu, và người
    # ký là các bên tham gia chứ không phải một chức danh ban hành.
    drop: [so_ky_hieu, noi_nhan]

  - id: giay_moi
    label: "Giấy mời"
    match: {ten_loai: ["GIẤY MỜI"]}
    drop: [noi_nhan]
    require:
      - id: kinh_gui
        label: "Kính gửi"
        severity: error

  - id: cong_van
    label: "Công văn"
    # Đặt cuối cùng vì đây là loại "còn lại". Theo NĐ 30 công văn KHÔNG ghi tên
    # loại, nên chuỗi rỗng ở dưới nghĩa là "không có dòng tên loại"; thực tế vẫn
    # gặp bản ghi hẳn chữ "CÔNG VĂN" nên nhận cả hai.
    match:
      ten_loai: ["CÔNG VĂN", ""]
      any_of: [kinh_gui, trich_yeu]
    drop: [ten_loai]
    require:
      - id: kinh_gui
        label: "Kính gửi"
        severity: error
